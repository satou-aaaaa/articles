# 公開するサイトの検査（Claude を使わない）。posts/ からサイトを作り直し、記事ページ・記事どうしのリンク・画像・フィードを見る。
# プルリクエストで ✅ になれば automerge.yml が自動でマージし、Pages の公開まで進める。
# main（メモアプリの書き出し）では公開を止めず、赤なら ci-failure-issue.yml が Issue で知らせる。
name: QA

on:
  pull_request:
    # 下書きを外したときも回す（回らないと自動マージが起きない）
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: サイトの検査
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: サイトを作って調べる
        run: node tools/check.js | tee -a "$GITHUB_STEP_SUMMARY"
