name: Auto merge

# 検査（QA）がプルリクエストで ✅ になったら自動で squash マージする。中身と条件は共通部品 satou-aaaaa/shared-workflows。
on:
  workflow_run:
    workflows: [QA]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  pages: write
  actions: write   # dispatch: で pages.yml を起こすのに要る（無いと 403 で公開が起きない）

jobs:
  merge:
    uses: satou-aaaaa/shared-workflows/.github/workflows/automerge.yml@main
    with:
      # このリポジトリは Actions（pages.yml）で公開する
      dispatch: "pages.yml"
      delete_branch: true
